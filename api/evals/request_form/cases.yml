# Labelled cases for the request-form eval. See README.md and LABELING.md.
#
# A case is one request: a patient's FHIR chart (the demo bundles in
# db/fhir/demo, or a Synthea patient in patients/), optionally changed by
# `mutate`, a payer and drug (which picks the question set), the state of each
# policy requirement, and the labels: what a careful staff member would enter.
#
# fields:   CoverMyMeds field => value (the prescriber's phone and address are
#           prescriber_phone and prescriber_address), or null when the chart does not hold it.
#           `patients` gives each chart's fields once; a case lists only changes.
# answers:  question linkId => the answer code (a list for a multi-select, a
#           string for a number), or `ask` / `check` when the right move is to
#           ask the prescriber's office or look elsewhere in the chart. Any
#           question not listed should not be shown.
# requirements: criterion position => met | pending | missing, or a hash with
#           status and quote (the verified text, when the answer is read from it).

