name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Rails Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./api
          bundler-cache: true

      - name: Run RuboCop
        working-directory: ./api
        run: bundle exec rubocop -f github

      - name: Run Brakeman
        working-directory: ./api
        run: bundle exec brakeman --no-pager

      - name: Set up database
        working-directory: ./api
        env:
          RAILS_ENV: test
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'test-secret-key-base-for-ci-only-not-used-in-production' }}
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run RSpec tests
        working-directory: ./api
        env:
          RAILS_ENV: test
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'test-secret-key-base-for-ci-only-not-used-in-production' }}
        run: bundle exec rspec

  test-frontend:
    name: Next.js Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # pnpm 12 reads the allowBuilds allowlist in base/pnpm-workspace.yaml and
      # requires Node >= 22.13, so the two versions below move together.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./base/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./base
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./base
        run: pnpm run lint

      - name: Build Next.js
        working-directory: ./base
        run: pnpm run build

      # No `--` before the flags: pnpm 10+ passes it through to jest, which then
      # treats `--ci` as a test path pattern and matches nothing.
      - name: Run Jest tests
        working-directory: ./base
        run: pnpm test --ci --coverage --maxWorkers=2
