    patient: demo-1002
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Zepbound
    mutate:
      - { set: Coverage/demo-1002-coverage, path: class.1.name, value: FEP Blue Standard }
      - { set: Coverage/demo-1002-coverage, path: payor.0.display, value: Blue Cross Blue Shield Federal Employee Program }
      - { delete: Condition/demo-1002-condition-3 }
      - { delete: Condition/demo-1002-condition-4 }
    fields: { plan: Blue Cross Blue Shield Federal Employee Program · FEP Blue Standard, other: null }
    requirements: { 1: met, 2: met, 3: met, 4: pending, 5: met, 6: met, 7: met, 8: pending }
    answers:
      <<: *marcus_fep
      initiation-comorbidity: ask

  - id: jane-cigna-wegovy
