    body: |
      Marguerite Dlamini comes in with her husband. She tells me she has struggled with her weight since her thirties.

      Today she weighs 244 pounds and her BMI comes to 38.9.

      I have her down as having class II obesity.

      Starting last November she cut her intake to about 1,400 calories a day on a plan our dietitian wrote, and she has been going to a senior fitness class on Mondays, Wednesdays, and Fridays ever since.

      Two years ago another doctor had her on naltrexone-bupropion for about four months; she stopped because it made her dizzy and she was not losing.

      She has never been on a GLP-1 drug and would only be on this one.

      We will ask her plan to cover liraglutide 3 mg.
