    body: |
      Bettina Kowalczyk, 29, asks about weight-loss injections.

      BMI 27.8.

      Assessment: overweight (E66.3). She is not obese.

      Family history: father with obesity and hypertension, sister with type 2 diabetes.

      Her own blood pressure is normal and she has no sleep apnea or dyslipidemia.

      She began a reduced-calorie diet eight months ago and added a physical activity plan (swimming twice weekly) at the same time.

      Her sister takes Ozempic; Bettina has never used a GLP-1 medication or any weight-loss drug.

      Plan: discussed criteria.
