# Grouped, weekly updates. Ungrouped dailies produced two dozen concurrent PRs
# and nobody drained them; grouping lands the same upgrades as a handful of
# reviewable batches instead.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Rails and its satellites move together or not at all.
      rails:
        patterns:
          - "rails"
          - "activerecord*"
          - "actionpack*"
          - "actionmailer*"
          - "activesupport*"
          - "activejob*"
          - "railties"
      # Anything that can't reach production gets one PR.
      dev-and-test:
        dependency-type: development
      production:
        dependency-type: production
        exclude-patterns:
          - "rails"
          - "activerecord*"
          - "actionpack*"
          - "actionmailer*"
          - "activesupport*"
          - "activejob*"
          - "railties"

  - package-ecosystem: npm
    directory: "/base"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # React and Next are a single upgrade decision.
      react-and-next:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"
          - "eslint-config-next"
      dev-and-test:
        dependency-type: development
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"
          - "typescript"
      production:
        dependency-type: production
        exclude-patterns:
          - "react"
          - "react-dom"
          - "next"
    ignore:
      # typescript-eslint does not support TypeScript 7.x: ESLint hard-errors
      # with "typescript-eslint does not support TS 7.0" and the Next.js Tests
      # job fails. Held at 5.x until typescript-eslint ships TS 7 support, then
      # remove this entry and take the major in its own PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
