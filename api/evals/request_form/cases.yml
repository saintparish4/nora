fep_coverage: &fep_standard
  - { set: Coverage/demo-1002-coverage, path: class.1.name, value: FEP Blue Standard }
  - { set: Coverage/demo-1002-coverage, path: payor.0.display, value: Blue Cross Blue Shield Federal Employee Program }

cases:
  - id: tom-fep-saxenda
    note: The seeded featured-for-submission request. Every requirement verified.
    patient: demo-1004
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Saxenda
    requirements: { 1: met, 2: { status: met, quote: "BMI 36.5 kg/m2 today." }, 3: met, 4: met, 5: met, 6: met }
    answers: &tom_answers
      age-group: 18-plus
      plan-option: standard-basic
      brand-generic: brand
      diagnosis: obesity
      pens-90-days: "15"
      program: "yes"
      glp1: no-glp1
      pa-combination: "no"
      change-from-zepbound: "no"
      continuation: initiation
      initiation-bmi: 30-plus

  - id: tom-blue-focus
    note: The same patient on Blue Focus, where Saxenda is non-formulary.
    patient: demo-1004
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Saxenda
    mutate:
      - { set: Coverage/demo-1004-coverage, path: class.1.name, value: FEP Blue Focus }
    requirements: { 1: met, 2: met, 3: met, 4: met, 5: met, 6: met }
    fields: { plan: Blue Cross Blue Shield Federal Employee Program · FEP Blue Focus }
    answers:
      <<: *tom_answers
      plan-option: focus
      change-from-zepbound: null
      focus-nonformulary: ask
      focus-switch-generic: ask

  - id: tom-option-not-named
    note: The coverage record does not say Standard, Basic or Focus; the card does.
    patient: demo-1004
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Saxenda
    mutate:
      - { set: Coverage/demo-1004-coverage, path: class.1.name, value: Service Benefit Plan }
      - { set: Coverage/demo-1004-coverage, path: class.1.value, value: sbp }
    requirements: { 1: met, 2: met, 3: met, 4: met, 5: met, 6: met }
    fields: { plan: Blue Cross Blue Shield Federal Employee Program · Service Benefit Plan }
    answers:
      <<: *tom_answers
      plan-option: check
      focus-nonformulary: ask
      focus-switch-generic: ask

  - id: tom-older-prescription
    note: Saxenda first written seven months before the request, so it may be a renewal.
    patient: demo-1004
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Saxenda
    mutate:
      - { set: MedicationRequest/demo-1004-rx, path: authoredOn, value: "2026-03-01" }
    requirements: { 1: met, 2: met, 3: met, 4: met, 5: met, 6: met }
    answers:
      <<: *tom_answers
      continuation: ask
      continuation-loss: ask
      continuation-maintained: ask

  - id: tom-switched-from-zepbound
    note: A stopped Zepbound order in the chart; the form asks whether this is a change from Zepbound.
    patient: demo-1004
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Saxenda
    mutate:
      - add:
          resourceType: MedicationRequest
          id: demo-1004-zepbound
          status: stopped
          intent: order
          subject: { reference: Patient/demo-1004 }
          authoredOn: "2026-05-04"
          medicationCodeableConcept: { coding: [ { system: http://www.nlm.nih.gov/research/umls/rxnorm, code: "2669706" } ], text: Zepbound 2.5 mg/0.5 mL auto-injector }
    requirements: { 1: met, 2: met, 3: met, 4: met, 5: met, 6: met }
    answers:
      <<: *tom_answers
      change-from-zepbound: "yes"

  - id: tom-old-coverage-first
    note: A cancelled earlier coverage sits in the chart beside the active one.
    patient: demo-1004
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Saxenda
    mutate:
      - add:
          resourceType: Coverage
          id: demo-1004-old-coverage
          status: cancelled
          beneficiary: { reference: Patient/demo-1004 }
          subscriberId: OLD555
          payor: [ { display: Aetna } ]
    requirements: { 1: met, 2: met, 3: met, 4: met, 5: met, 6: met }
    answers: *tom_answers

  - id: marcus-aetna-zepbound
    note: The seeded request still gathering evidence; nothing verified yet.
    patient: demo-1002
    payer: Aetna
    item: Zepbound
    requirements: { 1: pending, 2: pending, 3: pending, 4: pending }
    answers: &marcus_aetna
      age: "yes"
      program: ask
      bmi: ask
      comorbidity: ask

  - id: marcus-member-id-only-as-subscriber
    note: The coverage has no member identifier, only subscriberId.
    patient: demo-1002
    payer: Aetna
    item: Zepbound
    mutate:
      - { unset: Coverage/demo-1002-coverage, path: identifier }
    requirements: { 1: pending, 2: pending, 3: pending, 4: pending }
    answers: *marcus_aetna

  - id: marcus-fep-zepbound
    note: BMI 28.4 with hypertension and type 2 diabetes on the problem list, on the FEP form.
    patient: demo-1002
    payer: Blue Cross Blue Shield Federal Employee Program
    item: Zepbound
    mutate: *fep_standard
    fields: { plan: Blue Cross Blue Shield Federal Employee Program · FEP Blue Standard }
    requirements: { 1: met, 2: met, 3: met, 4: pending, 5: met, 6: met, 7: met, 8: pending }
    answers: &marcus_fep
      age-group: 18-plus
      plan-option: standard-basic
      brand-generic: brand
      tried-saxenda-wegovy: ask
      switch-preferred: ask
      pens-over-limit: "no"
      diagnosis: elevated-bmi
      program: "yes"
      glp1: no-glp1
      pa-combination: "no"
      continuation: initiation
      initiation-bmi: 27-29.9
      initiation-comorbidity: [ type-2-diabetes-mellitus, hypertension ]
      initiation-oral-trials: ask

  - id: marcus-fep-no-comorbidity-listed
