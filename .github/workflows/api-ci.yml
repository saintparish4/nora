name: API CI

on:
  pull_request:
    branches: [main, develop]
    paths: ['api/**']
  push:
    branches: [main, develop]
    paths: ['api/**']

jobs:
  scan_ruby:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./api
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        working-directory: ./api
        run: bundle exec brakeman --no-pager

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./api
          bundler-cache: true

      - name: Lint code for consistent style
        working-directory: ./api
        run: bundle exec rubocop -f github

  test:
    name: Rails Tests
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./api
          bundler-cache: true

      - name: Set up database
        working-directory: ./api
        env:
          RAILS_ENV: test
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'test-secret-key-base-for-ci-only-not-used-in-production' }}
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run RSpec tests
        working-directory: ./api
        env:
          RAILS_ENV: test
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE || 'test-secret-key-base-for-ci-only-not-used-in-production' }}
        run: bundle exec rspec
